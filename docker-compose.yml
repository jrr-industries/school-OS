# =============================================================================
# SchoolOS — Docker Development Environment
# =============================================================================
# Usage:
#   docker compose up --build        Build and start all services
#   docker compose up -d             Start in detached mode
#   docker compose down              Stop and remove containers
#   docker compose logs -f           Follow logs
#   docker compose ps                List containers
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Postgres — Primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: schoolos-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schoolos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolos}
      POSTGRES_DB: ${POSTGRES_DB:-schoolos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolos} -d ${POSTGRES_DB:-schoolos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - schoolos-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis — Cache / session store / queue broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: schoolos-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - schoolos-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # pgAdmin — Database management UI
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: schoolos-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@schoolos.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - schoolos-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Frontend — Next.js web application
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: schoolos-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Mount source code for hot-reload
      - ./apps/web:/app/apps/web
      # Preserve container node_modules (don't override with host files)
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/node_modules
      # Mount shared package source
      - ./packages/shared:/app/packages/shared
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    depends_on:
      # Backend is optional in development — uncomment when ready
      # backend:
      #   condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - schoolos-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Backend API — Scaffold (requires package.json + source code)
  # ---------------------------------------------------------------------------
  # Uncomment the following block once the backend is implemented:
  #
  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.backend
  #     target: development
  #   container_name: schoolos-backend
  #   restart: unless-stopped
  #   ports:
  #     - "${BACKEND_PORT:-4000}:4000"
  #   volumes:
  #     - ./backend:/app/backend
  #     - ./packages/shared:/app/packages/shared
  #     - /app/node_modules
  #   environment:
  #     NODE_ENV: development
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-schoolos}:${POSTGRES_PASSWORD:-schoolos}@postgres:5432/${POSTGRES_DB:-schoolos}
  #     REDIS_URL: redis://redis:6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - schoolos-network
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  schoolos-network:
    driver: bridge
