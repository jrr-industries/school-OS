version: '3.8'

services:
  app:
    container_name: schoolos-app
    build:
      context: ../..
      dockerfile: Dockerfile
      target: deps
    ports:
      - '3000:3000'
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/schoolos
      - DIRECT_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/schoolos
      - REDIS_URL=redis://redis:6379
    volumes:
      - ../../apps:/app/apps
      - ../../packages:/app/packages
      - ../../prisma:/app/prisma
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/admin/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - schoolos-network
    command: pnpm dev

  postgres:
    container_name: schoolos-postgres
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=schoolos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schoolos-network

  redis:
    container_name: schoolos-redis
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schoolos-network

volumes:
  postgres-data:
  redis-data:

networks:
  schoolos-network:
    driver: bridge
